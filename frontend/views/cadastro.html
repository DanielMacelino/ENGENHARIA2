<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Agenda IFCE</title>
    <script src="/config.js"></script>
    <link rel="stylesheet" href="/public/variables.css?v=2">
    <link rel="stylesheet" href="/public/layout.css?v=2">
    <link rel="stylesheet" href="/public/components.css?v=2">
    <link rel="stylesheet" href="/public/pages.css?v=4">

    <link rel="icon" href="https://ojdnbtrbzdwinnatdycd.supabase.co/storage/v1/object/public/imagenspublicas/imagesifceredondo.JPG" type="image/x-icon">
    <!-- Otimizações de Carregamento -->
    <link rel="preload" href="/public/poster.png" as="image">
    <link rel="preload" href="/public/IFCEVIDEO.mp4" as="video">
    
    <style>
        /* CSS Crítico */
        .video-background { background: #000 url('/public/poster.png') no-repeat center center; background-size: cover; }
        .login-card { opacity: 0; transform: translateY(20px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        body.loaded .login-card { opacity: 1; transform: translateY(0); }
    </style>
</head>


<body style="margin: 0; padding: 0; overflow: hidden; background: transparent;">


    <video autoplay muted loop playsinline poster="/public/poster.png" id="bg-video" class="video-background">
        <source src="/public/IFCEVIDEO.mp4" type="video/mp4">
    </video>



    <header class="top-header" style="background: rgba(14, 53, 27, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="header-left">
            <div class="logo-header">
                <div style="background: white; border-radius: 12px; padding: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center;">
                    <img src="https://ojdnbtrbzdwinnatdycd.supabase.co/storage/v1/object/public/imagenspublicas/images-removebg-preview%20(1).png" alt="Logo IFCE" style="height: 35px; width: auto; border-radius: 4px;">
                </div>
            </div>
            <div class="header-titles">
                <h1>Sistema de Agendamento - Posto de Saúde</h1>
                <h2>Instituto Federal de Educação, Ciência e Tecnologia do Ceará - Campus Crato</h2>
            </div>
        </div>
        <div>
            <a href="/" style="color: white; font-size: 0.9rem; text-decoration: none; font-weight: bold; background: var(--green-primary); padding: 8px 20px; border-radius: 20px;">Entrar</a>
        </div>
    </header>


    <div class="login-body" style="background: transparent;">


        <div class="login-card" style="max-width: 450px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.2);">

            <div class="login-logo">
                <span style="color:var(--green-primary); font-size: 1.8rem;">Crie sua Conta</span>
            </div>

            <form id="form-cadastro" class="login-form" onsubmit="realizarCadastro(event)">
                <div class="form-group">
                    <input type="text" id="nome" placeholder="Nome Completo" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="E-mail (Institucional preferencialmente)" required>
                </div>
                <div class="form-group">
                    <select id="tipo_usuario" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; margin-top: 5px;">
                        <option value="">Você é...</option>
                        <option value="aluno">Aluno / Usuário</option>
                        <option value="profissional">Profissional de Saúde</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="password" id="senha" placeholder="Crie uma Senha" required>
                </div>
                <div class="form-group">
                    <input type="password" id="confirmar_senha" placeholder="Confirme a Senha" required>
                </div>

                <div style="margin-top: 15px; margin-bottom: 20px;">
                    <button type="submit" class="btn-green" style="width: 100%; border-radius: 20px;">Cadastrar</button>
                </div>
            </form>

            <div style="font-size:0.85rem; color:#666; text-align:center;">
                Ao se cadastrar, você concorda com os <a href="#" style="color:blue; text-decoration:none;">Termos de Uso</a>.
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('bg-video');
            if (video) {
                video.play().catch(function(error) {
                    console.log("Autoplay preventido ou erro no vídeo:", error);
                });
            }
        });
    </script>
    <script type="module" src="/public/main.js?v=3"></script>

</body>

</html>
