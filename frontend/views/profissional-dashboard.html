<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profissional Dashboard - Posto de Saúde</title>
    <script src="/config.js"></script>
    <link rel="stylesheet" href="/public/style.css">
</head>

<body onload="carregarDashboardProfissional()">

    <header class="top-header">
        <div class="header-left">
            <div class="logo-header">
                <div style="width: 25px; height: 35px; background-color: #aae0a4; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px;">
                    <div style="background-color: var(--green-primary);"></div>
                    <div style="background-color: var(--green-primary);"></div>
                    <div style="background-color: var(--green-primary);"></div>
                    <div style="background-color: var(--green-primary);"></div>
                </div>
            </div>
            <div class="header-titles">
                <h1>Painel do Profissional - Posto de Saúde</h1>
                <h2>Instituto Federal de Educação, Ciência e Tecnologia do Ceará - Campus Crato</h2>
            </div>
        </div>
        <div>
            <a href="/login" class="btn-header-sair">Sair &#x21e8;</a>
        </div>
    </header>

    <div class="main-wrapper">
        <aside id="sidebar-container" class="sidebar"></aside>

        <main class="content-area">

            <div class="filter-bar">
                <div class="filter-group">
                    <label>Dia</label>
                    <input type="number" id="filtro-dia" class="filter-input" placeholder="Ex: 15" min="1" max="31">
                </div>
                <div class="filter-group">
                    <label>Mês</label>
                    <select id="filtro-mes" class="filter-input">
                        <option value="">Todos</option>
                        <option value="01">Janeiro</option>
                        <option value="02">Fevereiro</option>
                        <option value="03">Março</option>
                        <option value="04">Abril</option>
                        <option value="05">Maio</option>
                        <option value="06">Junho</option>
                        <option value="07">Julho</option>
                        <option value="08">Agosto</option>
                        <option value="09">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Ano</label>
                    <select id="filtro-ano" class="filter-input">
                        <option value="">Todos</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Status</label>
                    <select id="filtro-status" class="filter-input">
                        <option value="">Todos</option>
                        <option value="Pendente">Pendente</option>
                        <option value="Confirmado">Confirmado</option>
                        <option value="Atendido">Atendido</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>
                <button onclick="filtrarAgendamentosProfissional()" class="btn-filter">&#x1f50d; Filtrar</button>
                <button onclick="limparFiltros('agendamentos-prof')" class="btn-clear">Limpar</button>
            </div>

            <div class="card" style="padding: 0;">
                <div class="table-responsive">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>Paciente</th>
                                <th>Data</th>
                                <th>Horário</th>
                                <th>Motivo / Especialidade</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-pacientes-hoje">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 20px;">Carregando agendamentos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div style="text-align: right; margin-top: 15px;">
                <button onclick="exportarPDF('agendamentos')" class="btn-green" style="background-color:#555;">
                    &#x1f4c4; Gerar Relatório PDF
                </button>
            </div>

            <div class="page-header" style="margin-top: 40px;">
                <h2 class="page-title">Relatório Rápido</h2>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span>Atendidos no Mês</span>
                    <strong id="stat-atendidos">0</strong>
                </div>
                <div class="stat-box">
                    <span>Aguardando</span>
                    <strong id="stat-aguardando">0</strong>
                </div>
                <div class="stat-box">
                    <span>Faltas / Outros</span>
                    <strong id="stat-faltas">0</strong>
                </div>
            </div>

        </main>
    </div>

    <script src="/public/script.js"></script>
</body>

</html>
