<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Item - IFCE</title>
    <!-- Inclui o arquivo de configuração e estilos -->
    <script src="/config.js"></script>
    <link rel="stylesheet" href="/public/style.css">
    <link rel="icon" href="https://ojdnbtrbzdwinnatdycd.supabase.co/storage/v1/object/public/imagenspublicas/imagesifceredondo.JPG" type="image/x-icon">
</head>

<body>

    <!-- Header Principal -->
    <header class="top-header">
        <div class="header-left">
            <div class="logo-header">
                <img src="https://ojdnbtrbzdwinnatdycd.supabase.co/storage/v1/object/public/imagenspublicas/images-removebg-preview%20(1).png" alt="Logo IFCE">
            </div>
            <div class="header-titles">
                <h1>Sistema de Gerenciamento de Itens</h1>
                <h2>Instituto Federal de Educação, Ciência e Tecnologia do Ceará - Campus Crato</h2>
            </div>
        </div>
        <div>
            <!-- Botão sair volta para o login simulando deslogar -->
            <a href="/login" class="btn-header-sair">Sair &#x21e8;</a>
        </div>
    </header>

    <div class="main-wrapper">
        <aside id="sidebar-container" class="sidebar"></aside>

        <!-- Área de Conteúdo -->
        <main class="content-area">

            <div class="page-title">
                Cadastrar Novo Item
                <a href="/itens" class="btn-green"
                    style="background-color:#777; font-size: 0.9rem; padding: 8px 15px;">Voltar</a>
            </div>
            <p class="page-subtitle">Preencha o formulário para adicionar ao inventário.</p>

            <div class="card" style="max-width: 600px; margin: 0 auto; margin-top: 40px;">
                <h3 style="text-align: center; color: var(--green-primary); margin-bottom: 20px;">Formulário de Cadastro
                </h3>

                <!-- Formulário que chamará a Rota: POST /itens -->
                <form onsubmit="salvarNovoItem(event)">

                    <div class="form-group">
                        <label for="nomeItem">Nome do Item:</label>
                        <input type="text" id="nomeItem" placeholder="Ex: Cadeira Universitária" required>
                    </div>

                    <div class="form-group">
                        <label for="fotoItem">Foto do Item (Cloud - Requisito B):</label>
                        <input type="file" id="fotoItem" accept="image/*" style="border:none; background:#eee;">
                    </div>

                    <div class="form-group">
                        <label for="categoriaItem">Categoria:</label>
                        <select id="categoriaItem" required>
                            <option value="">Selecione uma categoria...</option>
                            <option value="Móveis">Móveis</option>
                            <option value="Eletrônicos">Eletrônicos</option>
                            <option value="Material de Limpeza">Material de Limpeza</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="qtdItem">Quantidade Inicial:</label>
                        <input type="number" id="qtdItem" min="1" value="1" required>
                    </div>

                    <div class="form-group">
                        <label for="obsItem">Observações:</label>
                        <textarea id="obsItem" rows="3" placeholder="Detalhes opcionais do item..."></textarea>
                    </div>

                    <div style="text-align: center; margin-top: 30px;">
                        <button type="submit" class="btn-green" id="btn-salvar-item" style="width: 100%;">Gravar
                            Item</button>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <!-- Inclui os scripts da aplicação -->
    <script src="/public/script.js"></script>
</body>

</html>
